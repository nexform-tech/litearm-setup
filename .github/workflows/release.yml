# Copy this file into a downstream repository as `.github/workflows/release.yml`.
# `scripts/sync.sh` does that automatically when the file does not exist yet.
#
# This is the source-only shape: compute the version, create the tag, create the
# GitHub release. GitHub attaches the source tarball and zip to every release by
# itself, so nothing else is required.
#
# Add the `publish` job from examples/publish.yml when the repository publishes to
# a registry, and the `package` job from examples/package.yml when it ships build
# artifacts. Both are independent siblings of `release`: add or delete them freely.
#
# The `package` job below is this repository's: it attaches the built guide, and the
# installation video, to every release.
name: Release

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write # create the tag and the GitHub release
  issues: write # comment on released issues
  pull-requests: write # comment on released pull requests

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never cancel a release mid-flight

jobs:
  # Versioning only: commit prefixes -> tag -> GitHub release. Language-agnostic.
  release:
    # Pin to a moving major tag (`@v1`), or to a commit SHA for maximum safety.
    uses: nexform-tech/repo-template/.github/workflows/release.yml@v1
    # Nothing else is needed to start on the 0.x line: the workflow bootstraps
    # `v0.0.0` once, so the first `feat:` is `0.1.0`. A repository that must keep
    # semantic-release's 1.0.0 first release disables the bootstrap explicitly.
    # with:
    #   initial-version: ""

  # Attach the two artifacts the release is for. The PDF is in the tree, so
  # packaging it is a copy. The video is not: at 73 MB it would be carried in the
  # clone by everyone who only wants the guide, so it was uploaded to a release by
  # hand and is copied forward from the newest release that has it. Without that
  # step a new release would silently drop the video from /releases/latest, which
  # is what the README points readers at.
  package:
    needs: release
    if: needs.release.outputs.new_tag != ''
    runs-on: ubuntu-22.04
    permissions:
      contents: write # attach artifacts to the GitHub release
    env:
      VERSION: ${{ needs.release.outputs.new_tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GUIDE: LITEARM-SE机械臂安装教程.pdf
      VIDEO: LITEARM-SE安装视频.mp4
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Stage the guide
        # The asset keeps the filename the repository uses rather than gaining the
        # version: the release tag is already the version, and the README links to
        # the file by this name.
        run: |
          mkdir -p dist
          cp "$GUIDE" dist/

      - name: Carry the installation video forward
        # Nothing to carry on the first run after this job is added, which is why an
        # absent predecessor is not an error; anything else is.
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
                 --jq ".[] | select(any(.assets[]; .name == \"$VIDEO\")) | .id" | head -1)
          if [ -z "$id" ]; then
            echo "::warning::no earlier release carries $VIDEO; this release will not have it"
          else
            gh api "repos/$GITHUB_REPOSITORY/releases/assets/$id" \
              -H 'Accept: application/octet-stream' > "dist/$VIDEO"
          fi

      - name: Attach artifacts to the release
        run: gh release upload "$VERSION" dist/* --clobber
