# Copy this file into a downstream repository as `.github/workflows/release.yml`.
# `scripts/sync.sh` does that automatically when the file does not exist yet.
#
# This is the source-only shape: compute the version, create the tag, create the
# GitHub release. GitHub attaches the source tarball and zip to every release by
# itself, so nothing else is required.
#
# Add the `publish` job from examples/publish.yml when the repository publishes to
# a registry, and the `package` job from examples/package.yml when it ships build
# artifacts. Both are independent siblings of `release`: add or delete them freely.
#
# The `package` job below is this repository's: it attaches both editions of the built
# guide to every release.
name: Release

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write # create the tag and the GitHub release
  issues: write # comment on released issues
  pull-requests: write # comment on released pull requests

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never cancel a release mid-flight

jobs:
  # Versioning only: commit prefixes -> tag -> GitHub release. Language-agnostic.
  release:
    # Pin to a moving major tag (`@v1`), or to a commit SHA for maximum safety.
    uses: nexform-tech/workflows/.github/workflows/release.yml@v1
    # Nothing else is needed to start on the 0.x line: the workflow bootstraps
    # `v0.0.0` once, so the first `feat:` is `0.1.0`. A repository that must keep
    # semantic-release's 1.0.0 first release disables the bootstrap explicitly.
    # with:
    #   initial-version: ""

  # Attach the guides the release is for. Both PDFs are in the tree, so packaging them
  # is a copy. The installation video is deliberately not attached: it is published on
  # Bilibili and the README links to it there, so no release has to carry it or
  # copy it forward from an earlier one.
  package:
    needs: release
    if: needs.release.outputs.new_tag != ''
    runs-on: ubuntu-22.04
    permissions:
      contents: write # attach artifacts to the GitHub release
    env:
      VERSION: ${{ needs.release.outputs.new_tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GUIDE_ZH: LITEARM-SE机械臂使用教程.pdf
      GUIDE_EN: LITEARM-SE-user-guide.pdf
      # The asset names are deliberately ASCII: GitHub strips non-ASCII characters
      # from asset names, so uploading the Chinese in-tree name would land as
      # `LITEARM-SE.pdf` and any later lookup by the name written here would never
      # match. They carry no version either, because the release tag is already the
      # version — the `-zh`/`-en` suffix is what tells the two editions apart.
      ASSET_ZH: LITEARM-SE-user-guide-zh.pdf
      ASSET_EN: LITEARM-SE-user-guide-en.pdf
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Stage the guides
        run: |
          mkdir -p dist
          cp "$GUIDE_ZH" "dist/$ASSET_ZH"
          cp "$GUIDE_EN" "dist/$ASSET_EN"

      - name: Attach artifacts to the release
        run: gh release upload "$VERSION" dist/* --clobber
